version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # React Native upgrades move react, the RN CLI/tooling and native code together; do them by hand.
      - dependency-name: react
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: react-native
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      bundler-security:
        applies-to: security-updates
        patterns:
          - '*'
      bundler-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
